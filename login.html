<!DOCTYPE html>
<!--
  login.html
  - Componente de inicio de sesión (HTML minimal y accesible)
  - Uso: abrir este archivo en el navegador para probar la interfaz.
  - Estructura: `main.login-page` contiene `section.login-card` con el formulario.
  - Accesibilidad: el `section` tiene `aria-labelledby` que referencia el título.
-->
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login tarea creado</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="login-page">
    <!-- Tarjeta de login: contiene el formulario principal -->
    <section class="login-card" aria-labelledby="login-title">
      <!-- Título visible, usado por lectores de pantalla -->
      <h1 id="login-title">Iniciar sesión</h1>

      <!-- Formulario de autenticación -->
      <form action="#" method="post" novalidate>
        <!-- Campo de usuario: etiqueta vinculada con `for` y `id` -->
        <label for="username">Usuario</label>
        <input
          type="text"
          id="username"
          name="username"
          placeholder="Ingresa tu usuario"
          autocomplete="username"
          required
        >

        <!-- Campo de contraseña: usa `autocomplete` para mejores manejadores de contraseña -->
        <label for="password">Contraseña</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="Ingresa tu contraseña"
          autocomplete="current-password"
          required
        >

        <!-- Botón de envío. En producción, reemplazar `action` por la ruta real y manejar CSRF. -->
        <button type="submit">Entrar</button>

        <!-- Ayuda visual bajo el botón; útil para instrucciones breves -->
        <p class="login-help">Usa tus credenciales asignadas para acceder al panel.</p>
      </form>
    </section>
  </main>
</body>
</html>
