<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login tarea repositorio</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="login-page">
    <section class="login-card" aria-labelledby="login-title">
      <h1 id="login-title">Iniciar sesión</h1>
      <form action="#" method="post" novalidate>
        <label for="username">Usuario</label>
        <input type="text" id="username" name="username" placeholder="Ingresa tu usuario" autocomplete="username" required>

        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" placeholder="Ingresa tu contraseña" autocomplete="current-password" required>

        <button type="submit">Entrar</button>
        <p class="login-help">Usa tus credenciales asignadas para acceder al panel.</p>
      </form>
    </section>
  </main>
</body>
</html>
